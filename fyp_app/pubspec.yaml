name: fyp_app
description: "Lafzio - assistive communication app for deaf and hearing users."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local storage
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # Device features (native bridge)
  permission_handler: ^13.0.2
  vibration: ^3.2.1
  flutter_local_notifications: ^23.0.4
  wakelock_plus: ^1.8.2
  record: ^7.2.0

  # On-device ML (YAMNet)
  tflite_flutter: ^0.12.1

  # Utilities
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
name: fyp_app
description: "Lafzio - assistive communication app for deaf and hearing users."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management and navigation
  flutter_riverpod: any
  go_router: any

  # Local storage
  sqflite: any
  path: any
  path_provider: any
  shared_preferences: any

  # Device features (native bridge)
  permission_handler: any
  vibration: any
  flutter_local_notifications: any
  wakelock_plus: any
  record: any

  # On-device ML (YAMNet)
  tflite_flutter: any

  # Utilities
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true

  assets:
    - assets/models/